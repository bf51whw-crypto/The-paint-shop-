    :root{
      --bg:#0b0d10;
      --panel:#12161b;
      --panel2:#0f1318;
      --text:#e9eef4;
      --muted:#a9b4c2;
      --line:rgba(255,255,255,.12);
      --accent:#7CFC00; /* lime green */
      --accent2:#a6ff4d;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --radius: 14px;
      --max: 1100px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(124,252,0,.18), transparent 60%), var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    a{ color:inherit; }

    .wrap{ max-width: var(--max); margin:0 auto; padding: 0 18px; }

    /* Top bar */
    .topbar{
      position: sticky;
      top:0;
      z-index: 10;
      background: rgba(11,13,16,.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 12px 0;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:.4px;
    }
    .brand-badge{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(124,252,0,.28), rgba(124,252,0,.08));
      border:1px solid rgba(124,252,0,.35);
      box-shadow: var(--shadow);
    }
    nav{ display:flex; gap:14px; color:var(--muted); font-weight:600; }
    nav a{ text-decoration:none; opacity:.9; }
    nav a:hover{ color:var(--text); }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      text-decoration:none;
      font-weight:700;
      box-shadow: none;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(1px); }
    .btn-accent{
      background: linear-gradient(180deg, rgba(124,252,0,.95), rgba(124,252,0,.72));
      border-color: rgba(124,252,0,.65);
      color:#0b0d10;
    }
    .btn-accent:hover{ background: linear-gradient(180deg, rgba(166,255,77,.98), rgba(124,252,0,.78)); }

    /* Hero */
    header.hero{
      padding: 46px 0 22px;
    }
    .hero-card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .hero-inner{
      padding: 34px 22px;
      display:grid;
      grid-template-columns: 1.25fr .9fr;
      gap: 22px;
      align-items:center;
    }
    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      color: var(--accent2);
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1{
      margin: 10px 0 8px;
      font-size: clamp(34px, 5vw, 54px);
      line-height:1.05;
      letter-spacing: -.8px;
    }
    .sub{
      margin: 0;
      color: var(--muted);
      font-size: 16.5px;
      max-width: 62ch;
    }
    .pillrow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top: 18px;
    }
    .pill{
      border:1px solid rgba(124,252,0,.22);
      background: rgba(124,252,0,.06);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 999px;
      font-weight:700;
      font-size: 13px;
    }

    .contactbox{
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0,0,0,.22);
      padding: 16px;
    }
    .contactbox h3{ margin:0 0 10px; font-size: 16px; }
    .contactgrid{ display:grid; gap:10px; }
    .contactrow{ display:flex; gap:10px; flex-wrap:wrap; }
    .small{ color: var(--muted); font-size: 13px; }
    .mono{ font-variant-numeric: tabular-nums; }

    /* Sections */
    section{ padding: 34px 0; }
    .section-title{
      font-size: 26px;
      margin: 0 0 10px;
      letter-spacing: -.2px;
    }
    .section-lead{ margin: 0 0 18px; color: var(--muted); }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }
    .card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
      box-shadow: 0 10px 26px rgba(0,0,0,.28);
      padding: 16px;
    }
    .card h4{ margin:0 0 8px; }
    .card p{ margin:0; color: var(--muted); }

    .services .card{ grid-column: span 6; }

    .why .card{ grid-column: span 4; }

    /* Gallery */
    .gallery-pair{ grid-column: span 12; padding: 0; overflow:hidden; }
    .pair-head{ padding: 14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .pair-head strong{ letter-spacing:.2px; }
    .pair-head span{ color: var(--muted); font-size: 13px; }
    .pair-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 0; }
    figure{ margin:0; position:relative; }
    figure img{ width:100%; height: 320px; object-fit: cover; display:block; }
    .tag{
      position:absolute;
      left:12px;
      top:12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .6px;
      text-transform: uppercase;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.18);
    }
    .tag.before{ color: #fff; }
    .tag.after{ color: var(--accent2); border-color: rgba(124,252,0,.55); }

    /* Reviews */
    .reviews .card{ grid-column: span 4; }
    .stars{ color: var(--accent2); font-size: 14px; letter-spacing: 1px; }

    /* Map */
    .map{ padding: 0; overflow:hidden; }
    .map iframe{ width:100%; height: 360px; border:0; display:block; }

    footer{
      border-top: 1px solid var(--line);
      padding: 22px 0 30px;
      color: var(--muted);
    }

    /* Responsive */
    @media (max-width: 860px){
      .hero-inner{ grid-template-columns: 1fr; }
      nav{ display:none; }
      .services .card{ grid-column: span 12; }
      .why .card{ grid-column: span 12; }
      .reviews .card{ grid-column: span 12; }
      .pair-grid{ grid-template-columns: 1fr; }
      figure img{ height: 260px; }

      /* Mobile quick actions */
      .mobile-cta{ display:flex; }
      body{ padding-bottom: 74px; }
    }

    .mobile-cta{
      display:none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      gap: 10px;
    }
    .mobile-cta a{
      flex: 1;
      padding: 14px 12px;
      border-radius: 14px;
      text-align: center;
      font-weight: 900;
      text-decoration: none;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .mobile-cta .call{ background: linear-gradient(180deg, rgba(124,252,0,.95), rgba(124,252,0,.72)); color:#0b0d10; border-color: rgba(124,252,0,.65); }
    .mobile-cta .wa{ background: rgba(255,255,255,.06); color: var(--text); }

    /* Print safety */
    @media print{
      .topbar{ position: static; }
      .btn{ display:none; }
    }
  </style></head>
